# The quality gates from CLAUDE.md, run by a machine instead of by hand.
#
# The rollout is the second job below. It waits for the gates, runs only on a
# push to `main`, and reaches the Uberspace with a key that is restricted
# there to exactly one command.
name: Quality gates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    name: Lint, test and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          # The version the Uberspace serves. `composer.json` allows anything
          # from 8.4 up, but testing against a version that never ships means a
          # gate can stay green while the release stumbles.
          php-version: '8.5'
          extensions: ctype, iconv
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # A lock file that no longer matches composer.json installs versions
      # nobody chose. It went unnoticed here once already.
      - name: Validate the composer files
        run: composer validate --no-check-all --no-check-publish

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress

      - name: Install Node dependencies
        run: npm ci

      - name: Lint Twig
        run: php bin/console lint:twig templates

      - name: Lint YAML
        run: php bin/console lint:yaml config

      - name: Lint the service container
        run: php bin/console lint:container

      # Piped through xargs on purpose: with `-exec` the step reports the exit
      # status of `find`, which GNU find leaves at zero even when the linter
      # failed. xargs passes the failure through.
      - name: Lint PHP
        run: find src tests -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Test
        run: php bin/phpunit

      - name: Build the stylesheet
        run: npm run build

      # `output.css` is committed and linked statically, so a template that
      # introduces a utility class without a rebuild ships a stylesheet that
      # silently lacks it. If the build changes the file, the commit is
      # incomplete.
      - name: Check the committed stylesheet is current
        run: git diff --exit-code --stat public/css/output.css

  # Rolling out is a second job, so it can only start once the gates are
  # green. The key it uses is restricted on the server to exactly one
  # command — `cd ~/html/krausgebaut && bin/deploy` — so a leaked secret
  # buys a redeploy of what is already on `main`, and nothing else.
  deploy:
    name: Roll out
    needs: gates
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Load the deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Run bin/deploy on the server
        run: >-
          ssh -T -o StrictHostKeyChecking=accept-new
          ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
